<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2c544">
  <title>주문서 만들기 · 샌드</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="toolbar screen-only">
      <div><span class="brand">샌드</span><h1>주문서 만들기</h1><p>정성껏 만든 농산물, 주문도 편안하게 준비하세요.</p></div>
      <button type="button" id="print" class="primary">인쇄 · PDF</button>
    </header>
    <div class="status-bar screen-only"><span id="save-status" role="status">입력한 내용은 이 브라우저에 자동 저장돼요.</span><span>부가세 10% 자동 계산</span></div>
    <article class="paper" aria-label="주문서">
      <header class="document-header"><div><p class="eyebrow">샌드 · 농산물 가공 판매</p><h2>주문서</h2></div><p class="document-tag">마음을 담아 보내드립니다</p></header>
      <section class="details" aria-label="주문 기본 정보">
        <label>주문 날짜<input id="order-date" type="date"><span class="print-value" data-for="order-date"></span></label>
        <label>주문 번호<input id="order-number" maxlength="28" placeholder="예: 주문-001"><span class="print-value" data-for="order-number"></span></label>
        <label>주문하시는 분<input id="customer" maxlength="24" autocomplete="off"><span class="print-value" data-for="customer"></span></label>
        <label>연락처<input id="phone" type="tel" maxlength="24" autocomplete="off"><span class="print-value" data-for="phone"></span></label>
      </section>
      <section class="items-section" aria-labelledby="items-title">
        <div class="section-title"><h3 id="items-title">주문 품목</h3><span class="screen-only">단가는 부가세 별도예요.</span></div>
        <div class="table-head" aria-hidden="true"><span>품목</span><span>수량</span><span>단가</span><span>금액</span><span class="screen-only">관리</span></div>
        <div id="items"></div>
        <button type="button" id="add-item" class="add-button screen-only">＋ 품목 추가</button>
        <p id="item-help" class="screen-only">A4 한 장에 담도록 품목은 6줄까지 작성할 수 있어요.</p>
        <p id="notice" class="screen-only" role="status"></p>
      </section>
      <section class="totals" aria-label="주문 금액 합계">
        <div><span>품목 합계</span><strong id="subtotal">0원</strong></div>
        <div><span>부가세 (10%)</span><strong id="tax">0원</strong></div>
        <div class="grand-total"><span>총 주문 금액</span><strong id="total">0원</strong></div>
      </section>
      <section class="memo-section"><label for="memo">전하실 말씀</label><textarea id="memo" rows="2" maxlength="100" placeholder="배송 요청 등 필요한 내용을 적어 주세요."></textarea><p class="print-value" data-for="memo"></p></section>
      <footer class="document-footer"><strong>샌드</strong><span>좋은 농산물에 정성을 더합니다. 주문해 주셔서 고맙습니다.</span></footer>
    </article>
    <p class="bottom-help screen-only">인쇄 창에서 ‘PDF로 저장’을 선택하면 파일로 간직할 수 있어요.</p>
  </main>
</body>
</html>
