<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4d35e">
  <title>현장 사진</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="현장 사진">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><h1>현장 사진</h1><button type="button" id="install-app" class="primary small" hidden>앱 설치</button></header>

    <section class="card" aria-label="사진 찍기">
      <div class="viewfinder"><video id="camera" autoplay playsinline muted hidden></video><div id="camera-placeholder"><span class="camera-symbol" aria-hidden="true">◎</span><p>카메라 켜기를 눌러 주세요.</p></div></div>
      <div class="camera-actions"><button type="button" id="start-camera" class="primary" disabled>카메라 켜기</button><button type="button" id="capture" class="primary big" hidden disabled>사진 찍기</button><button type="button" id="stop-camera" hidden>카메라 끄기</button></div>
    </section>

    <p id="notice" class="notice" role="status">사진을 불러오고 있어요…</p>

    <section class="card" aria-labelledby="album-title">
      <div class="heading"><h2 id="album-title">찍은 사진</h2><span id="album-count">0장</span></div>
      <div class="album-tools"><button type="button" id="select-batch" disabled>최근 10장</button><button type="button" id="clear-selection" disabled>선택 해제</button></div>
      <p id="empty" class="empty">아직 사진이 없어요.</p>
      <div id="photos" class="photos"></div>
      <div class="share-panel">
        <strong id="selection-count">선택한 사진 0장</strong>
        <button type="button" id="share" class="primary" disabled>공유하기</button>
        <p class="help">카카오톡, 메시지, 구글 드라이브, 퀵 쉐어 등 보낼 앱을 고르세요. 한 번에 최대 10장이에요.</p>
        <button type="button" id="delete-selected" class="danger" disabled>선택한 사진 삭제</button>
      </div>
    </section>
    <p id="storage-info" class="foot"></p>
  </main>
  <dialog id="photo-dialog"><div class="dialog-top"><p id="large-caption"></p><button type="button" id="close-photo">닫기</button></div><img id="large-photo" alt="크게 본 사진"></dialog>
  <dialog id="delete-dialog"><h2>사진을 지울까요?</h2><p id="delete-description"></p><p>지운 사진은 되돌릴 수 없어요. 이미 보낸 사진에는 영향이 없어요.</p><div class="dialog-actions"><button type="button" id="cancel-delete">취소</button><button type="button" id="confirm-delete" class="danger">삭제</button></div></dialog>
</body>
</html>
